[package]
authors.workspace = true
categories = ["finance", "localization", "no-std", "no-std::no-alloc"]
description = "Static ISO 4217 Data"
documentation = "https://docs.rs/iso4217-static"
edition.workspace = true
keywords = ["currency", "iso4217"]
license.workspace = true
name = "iso4217-static"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
cfg-if = "1"
iso3166-static = { default-features = false, version = "0.4.2" }
iso4217-macros.workspace = true
serde = { optional = true, workspace = true }
zerocopy = { default-features = false, features = [
  "derive",
], optional = true, version = "0.8.21" }

[dev-dependencies]
serde = { features = ["alloc", "derive"], workspace = true }
serde_json = "1"

[build-dependencies]
iso4217-macros.workspace = true

[features]
alloc = ["iso3166-static/alloc", "serde?/alloc", "zerocopy?/alloc"]
default = ["serde"]
serde = ["dep:serde", "iso3166-static/serde"]
zerocopy = ["dep:zerocopy"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
