[package]
authors.workspace = true
categories = ["finance", "localization"]
description = "Procedural Macros for Generating ISO 4217 Data"
documentation = "https://docs.rs/iso4217-macros"
edition.workspace = true
keywords = ["currency", "iso4217", "proc-macro"]
license.workspace = true
name = "iso4217-macros"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
heck = "0.5"
iso4217-parser.workspace = true
proc-macro2 = "1.0.107"
quick-xml.workspace = true
quote = "1.0.47"
serde = { workspace = true, features = ["derive"] }
syn = { version = "3", features = ["fold", "full"] }

[lib]
proc-macro = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
